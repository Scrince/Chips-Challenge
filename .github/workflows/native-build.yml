name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build and package Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/build-windows.ps1
          -BuildDirectory build/windows
          -Generator "Visual Studio 17 2022"
          -Architecture x64
          -Configuration Release
          -Package
          -PackageDirectory build/windows/packages

      - name: Install Linux SDL3 backend dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libusb-1.0-0-dev libfluidsynth-dev fluid-soundfont-gm \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev

      - name: Configure (macOS and Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build/${{ runner.os == 'Linux' && 'linux' || 'macos' }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build/${{ runner.os == 'Linux' && 'linux' || 'macos' }} --config Release --parallel

      - name: Stage relocatable application (macOS and Linux)
        if: runner.os != 'Windows'
        run: cmake --install build/${{ runner.os == 'Linux' && 'linux' || 'macos' }} --prefix "$GITHUB_WORKSPACE/stage"

      - name: Validate staged application and original assets (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          "$GITHUB_WORKSPACE/stage/chips-native" --validate "$GITHUB_WORKSPACE/stage/data/CHIPS.DAT"
          "$GITHUB_WORKSPACE/stage/chips-native" --validate-atlas "$GITHUB_WORKSPACE/stage/assets/art/tile-atlas.png"
          "$GITHUB_WORKSPACE/stage/chips-native" --validate-icon "$GITHUB_WORKSPACE/stage/assets/art/app-icon-polished.png"
          "$GITHUB_WORKSPACE/stage/chips-native" --validate-player-sprites \
            "$GITHUB_WORKSPACE/stage/assets/art/player-poses-polished.png" \
            "$GITHUB_WORKSPACE/stage/assets/art/player-swim-poses-polished.png"
          "$GITHUB_WORKSPACE/stage/chips-native" --validate-cleaned-sprites \
            "$GITHUB_WORKSPACE/stage/assets/art/creature-sprites-polished.png" \
            "$GITHUB_WORKSPACE/stage/assets/art/key-boot-icons-polished.png"
          "$GITHUB_WORKSPACE/stage/chips-native" --validate-digits "$GITHUB_WORKSPACE/stage/assets/art/digital-digits.png"

      - name: Test
        run: ctest --test-dir build/${{ runner.os == 'Windows' && 'windows' || (runner.os == 'Linux' && 'linux' || 'macos') }} --build-config Release --output-on-failure

      - name: Upload portable Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chips-native-windows-x64-release
          path: build/windows/packages/chips-native-windows-x64-Release.zip
          if-no-files-found: error

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: bash ./scripts/build-linux-release.sh

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chips-native-linux-x86_64-release
          path: build/linux/packages/Chips-Challenge-*-Linux-*.tar.gz
          if-no-files-found: error

      - name: Package macOS releases
        if: runner.os == 'macOS'
        run: bash ./scripts/build-macos-release.sh

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chips-native-macos-releases
          path: |
            build/macos/Chips-Challenge-*-macOS-arm64.zip
            build/macos/Chips-Challenge-*-macOS-x86_64.zip
            build/macos/Chips-Challenge-*-macOS-universal.zip
          if-no-files-found: error
